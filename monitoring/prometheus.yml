global:
  scrape_interval: 30s

scrape_configs:
  - job_name: booking-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8080

  - job_name: insurance-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 10.0.0.38:8080

  - job_name: booking-cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: insurance-cadvisor
    static_configs:
      - targets:
          - 10.0.0.38:8082
