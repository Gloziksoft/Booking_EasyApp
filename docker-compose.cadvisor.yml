services:
  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - "10.0.0.54:8081:8080"
      - "127.0.0.1:8081:8080"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run:/var/run:rw
    privileged: false
    restart: unless-stopped
    networks:
      - booking_network

networks:
  booking_network:
    external: true
