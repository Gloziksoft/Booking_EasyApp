<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout.html :: head}"></head>

<body class="d-flex flex-column min-vh-100">

<header th:replace="~{fragments/layout.html :: header}"></header>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-sm w-100" style="max-width: 400px;">
        <div class="card-body">

            <h3 class="card-title mb-3 text-center">Nastaviť nové heslo</h3>

            <!-- FORMULÁR NA RESET HESLA -->
            <form th:action="@{/account/reset-password}"
                  th:object="${resetPasswordDTO}"
                  method="post">

                <!-- TOKEN -->
                <input type="hidden"
                       th:field="*{token}"/>

                <!-- NOVÉ HESLO -->
                <div class="mb-3">
                    <label for="password" class="form-label">
                        Nové heslo
                    </label>

                    <input type="password"
                           class="form-control"
                           id="password"
                           th:field="*{password}"
                           required>

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}">
                    </div>
                </div>

                <!-- POTVRDENIE HESLA -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">
                        Potvrdiť heslo
                    </label>

                    <input type="password"
                           class="form-control"
                           id="confirmPassword"
                           th:field="*{confirmPassword}"
                           required>

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}">
                    </div>
                </div>

                <!-- TOKEN ERROR -->
                <div class="text-danger mb-3"
                     th:if="${#fields.hasErrors('token')}"
                     th:errors="*{token}">
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Uložiť heslo
                </button>

            </form>

            <!-- ERROR SPRÁVA -->
            <p th:if="${error}"
               th:text="${error}"
               class="text-danger mt-3 text-center">
            </p>

        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout.html :: footer}"></footer>

</body>
</html>
